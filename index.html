<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>People Tech - Inicia sesión</title>

 
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
 
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">


  
  <link rel="stylesheet" href="styles/style.css">
  <link rel="stylesheet" href="styles/index.css">
</head>
<body>

  <div class="login-page d-flex align-items-center justify-content-center">
    <div class="login-wrapper">

      <div class="login-card">
       
        <div class="d-flex align-items-center brand-row">
          <div class="brand-icon">PT</div>
          <span class="brand-name">People Tech</span>
        </div>

        
        <h1 class="login-title">Inicia sesión</h1>
        <p class="login-subtitle">Usa tu cuenta corporativa para entrar al portal.</p>

       
        <form id="loginForm">
          <div class="mb-4">
            <label for="emailOrPhone" class="form-label">Correo o número de teléfono</label>
            <input type="text" class="form-control custom-input" id="emailOrPhone" value="grecia.archuleta@peopletech.mx">
          </div>

          <div class="mb-4">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control custom-input" id="password" value="password123">
          </div>

          <button type="submit" class="btn btn-primary btn-continue w-100 d-flex align-items-center justify-content-center gap-2">
            <i class="bi bi-key-fill"></i>
            Continuar
          </button>
        </form>
      </div>

      <p class="footer-note text-center">Acceso protegido con verificación en dos pasos.</p>

    </div>
  </div>

  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault(); 
      window.location.href = 'verify.html'; 
    });
  </script>
</body>
</html>
